name: Release

# Ein Tag wie v0.2.0 baut die Pakete für Linux, macOS und Windows und legt das
# GitHub-Release an. Der eingebaute Updater holt sich von dort die neue Version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            asset: picsim-linux-x86_64.tar.gz
          - os: macos-14
            asset: picsim-macos-aarch64.tar.gz
          - os: windows-latest
            asset: picsim-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2

      - name: Version zum Tag prüfen
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $v in Cargo.toml"
            exit 1
          fi

      - run: cargo test --workspace --release
      - run: cargo build --release -p picsim

      - name: Linux-Paket
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/picsim
          cp target/release/picsim packaging/picsim.desktop packaging/picsim.png README.md dist/picsim/
          strip dist/picsim/picsim
          tar -C dist -czf "${{ matrix.asset }}" picsim

      - name: macOS-Paket
        if: runner.os == 'macOS'
        run: |
          v="${GITHUB_REF_NAME#v}"
          app=dist/PicSim.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/picsim "$app/Contents/MacOS/"
          sed "s/VERSION/$v/g" packaging/Info.plist > "$app/Contents/Info.plist"
          mkdir picsim.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/picsim-512.png --out "picsim.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d packaging/picsim-512.png --out "picsim.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns picsim.iconset -o "$app/Contents/Resources/picsim.icns"
          codesign --force --deep -s - "$app"
          tar -C dist -czf "${{ matrix.asset }}" PicSim.app

      - name: Windows-Paket
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/picsim | Out-Null
          Copy-Item target/release/picsim.exe, README.md dist/picsim/
          Compress-Archive -Path dist/picsim -DestinationPath "${{ matrix.asset }}"

      - name: Prüfsumme
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## $v" '/^## / { f = (index($0, v) == 1); next } f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "PicSim $v" --notes-file notes.md
