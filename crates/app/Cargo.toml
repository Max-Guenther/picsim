[package]
name = "picsim"
description = "PIC16F84-Simulator mit Assembler und Editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "picsim"
path = "src/main.rs"

[dependencies]
picsim-core = { path = "../core" }
picsim-asm = { path = "../asm" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = "0.37.0"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
dirs = "7.0.0"
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
self-replace = "1.5.0"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.10"
