[package]
name = "picsim"
description = "PIC16F84-Simulator mit Assembler und Editor"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "picsim"
path = "src/main.rs"

[dependencies]
picsim-core = { path = "../core" }
picsim-asm = { path = "../asm" }
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui_extras = "0.37.0"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
dirs = "7.0.0"
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
self-replace = "1.5.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSURL", "NSString", "NSNotification"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
